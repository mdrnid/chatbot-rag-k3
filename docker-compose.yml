version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: k3-rag-api
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-ollama}
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:7b}
      - EMERGENCY_CONTACT=Tim ERT site (ext. 112)
      - EMERGENCY_CONTACT_NAME=ERT
      - EMERGENCY_CONTACT_PHONE=112
      - CORS_ORIGINS=http://localhost:3000,http://web:3000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: k3-rag-web
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://api:8000
      - NEXT_PUBLIC_DEBUG_MODE=false
    depends_on:
      - api
    restart: unless-stopped
